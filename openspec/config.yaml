schema: spec-driven

# Constraints that shape every artifact and that an agent cannot infer from the code.
# General documentation and discoverable codebase facts belong in docs/, not here.
context: |
  oppie.lab is a single-user research workspace. There are no accounts, no teams, no sharing, and
  no billing, and adding them needs a `DECISIONS.md` entry first.

  The product invariants in `AGENTS.md` § 6 and `docs/RULES.md` are requirements, not style. The
  two that shape almost every spec:

  **A score is a judgement, and shows its inputs.** The engine may score and rank problems. A score
  must be computed from stated dimensions with stated weights, must expose every dimension's
  contribution and the citation behind it, must say how many dimensions it was computed over with
  blanks never summed as zero, and must be labelled as the system's judgement rather than as a
  measurement, a probability or a forecast. Banned: a number that hides how it was made, and any
  figure dressed up as a measurement. A person's own rating, stored beside the machine's against the
  rubric version that produced it, is what keeps the rubric honest.

  **Nothing applies itself.** The engine may collect and may suggest. A suggestion reaches a record
  only when a person accepts it, and acceptance writes the value, the reason and the source
  together, in one action. A suggestion carrying no reason is rejected at the storage boundary.

  Two more that are easy to break silently: **empty is not zero** — a checked `0` and an unchecked
  blank are different readings and must survive storage, analysis and rendering, with blanks shown
  rather than summed. And **the six seeded candidates in `lib/data.ts` are reference data for the
  method**, never a shortlist, and are never uploaded to the database.

  Prefer requirements that can be checked from a stored record or a stored artifact over
  requirements that need a model running. Write all artifacts in English.
